# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Ein Graph aus Seiten
  en: A graph made of pages
description:
  de: "Der Hypertext: Seiten und Verweise, Startseite und Linktext, Klickwege. Anders lesen als im Buch."
  en: "Hypertext: pages and links, home page and link text, click paths. Reading differently from a book."
competencies: [hypertext]
blocks:
  - type: section
    id: einstieg
    title:
      de: Wie viele Klicks bis zum Schwimmbad?
      en: How many clicks to the pool?
    blocks:
      - type: note
        title:
          de: Klassenchat 7b
          en: Class 7b chat
        blocks:
          - type: text
            text:
              de: |
                **Frau Berg:** Unser Projekt: ein Stadtführer für die neuen Fünfer, mit fünf Seiten, die sich verlinken.

                **Selin:** Ich mache die Seiten zum Bus und zum Schwimmbad!

                **Mia:** Ich habe schon mal aufgezeichnet, wer auf wen verlinkt.
              en: |
                **Ms Berg:** Our project: a town guide for the new Year 5 pupils, with five pages that link to each other.

                **Selin:** I'll do the pages about the bus and the pool!

                **Mia:** I've already drawn who links to whom.
      - type: number
        id: klicks-schwimmbad
        text:
          de: Du bist auf der Startseite. Wie viele Klicks brauchst du mindestens bis zur Seite Schwimmbad?
          en: You are on the home page. What is the smallest number of clicks you need to get to the Pool page?
        material:
          - type: figure
            image:
              de: images/stadtfuehrer-de.svg
              en: images/stadtfuehrer-en.svg
            alt:
              de: "Fünf Kästchen. In der Mitte die Startseite, hellblau. Pfeile führen von der Startseite zu Schule und Bus, von Schule zu Bücherei, von Bus zu Schwimmbad, von Bücherei und von Schwimmbad zurück zur Startseite."
              en: "Five boxes. In the middle the home page, light blue. Arrows lead from the home page to School and Bus, from School to Library, from Bus to Pool, and from Library and from Pool back to the home page."
            caption:
              de: Mias Plan des Stadtführers. Jedes Kästchen ist eine Seite, jeder Pfeil ein Link.
              en: "Mia's plan of the town guide. Each box is a page, each arrow is a link."
            source:
              de: eigene Zeichnung, Oliver Jägle
              en: own drawing, Oliver Jägle
            licence: CC-BY-4.0
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 3
            message:
              de: Du hast die Seiten gezählt, auch die Startseite. Ein Klick ist ein Pfeil.
              en: You counted the pages, including the home page. One click is one arrow.
          - answer: 1
            message:
              de: Von der Startseite führt kein Pfeil direkt zum Schwimmbad. Du musst über eine andere Seite.
              en: No arrow leads straight from the home page to the pool. You have to go via another page.
        explanation:
          de: "Startseite → Bus → Schwimmbad: zwei Pfeile, also zwei Klicks. Jeder Klick folgt einem Link."
          en: "Home page → Bus → Pool: two arrows, so two clicks. Each click follows a link."
  - type: section
    id: idee
    title:
      de: Seiten und Links
      en: Pages and links
    blocks:
      - type: text
        text:
          de: |
            Auf der Seite davor hast du Links als Pfeile gezeichnet. Auf dieser Seite lernst du, wie ein ganzer
            **Hypertext** aufgebaut ist.
          en: |
            On the page before, you drew links as arrows. On this page you will learn how a whole **hypertext** is
            built.
      - type: definition
        term:
          de: Hypertext
          en: hypertext
        explanation:
          de: Ein Hypertext besteht aus Seiten, die durch Links verbunden sind. Als Graph sind die Seiten Knoten und die Links Pfeile.
          en: A hypertext is made of pages that are joined by links. As a graph, the pages are nodes and the links are arrows.
      - type: definition
        term:
          de: Startseite
          en: home page
        explanation:
          de: Die Startseite ist die Seite, auf der man einen Hypertext zu lesen beginnt. Von ihr aus erreichst du über Links die anderen Seiten.
          en: The home page is the page where you start reading a hypertext. From it you can reach the other pages through links.
      - type: figure
        image:
          de: images/startseite-de.svg
          en: images/startseite-en.svg
        alt:
          de: "Die Startseite „Unser Viertel“. Text: Hallo, liebe Fünfer! Hier findet ihr den Weg zur Schule und den Busplan. Die Wörter Weg zur Schule und Busplan sind blau und unterstrichen."
          en: "The home page “Our area”. Text: Hello, Year 5! Here you will find the way to school and the bus map. The words way to school and bus map are blue and underlined."
        caption:
          de: So sieht die Startseite im Browser aus. Die blauen, unterstrichenen Wörter sind die Linktexte.
          en: This is what the home page looks like in the browser. The blue, underlined words are the link texts.
        source:
          de: eigene Zeichnung, Oliver Jägle
          en: own drawing, Oliver Jägle
        licence: CC-BY-4.0
      - type: definition
        term:
          de: Linktext
          en: link text
        explanation:
          de: Der Linktext ist das Wort, das du anklickst. Er sagt dir, wohin der Link führt.
          en: The link text is the word you click on. It tells you where the link leads.
      - type: text
        text:
          de: Ein Buch liest du von vorn nach hinten. In einem Hypertext wählst du selbst, welchem Link du folgst.
          en: You read a book from front to back. In a hypertext, you choose for yourself which link to follow.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: matching
        id: teile-hypertext
        text:
          de: Ordne jedem Teil des Stadtführers zu, was er im Graphen oder auf der Seite ist.
          en: Match each part of the town guide to what it is in the graph or on the page.
        pairs:
          - left: { de: Seite, en: page }
            right: { de: ein Knoten, en: a node }
          - left: { de: Link, en: link }
            right: { de: ein Pfeil, en: an arrow }
          - left: { de: Startseite, en: home page }
            right: { de: "der Knoten, bei dem man beginnt", en: the node where you start }
          - left: { de: Linktext, en: link text }
            right: { de: "das Wort, das man anklickt", en: the word you click on }
        distractors:
          - { de: eine Linie ohne Richtung, en: a line without a direction }
        explanation:
          de: "Seiten sind die Knoten, Links die Pfeile. Die Startseite ist der Knoten, bei dem man beginnt, und der Linktext steht auf der Seite."
          en: "Pages are the nodes, links are the arrows. The home page is the node where you start, and the link text is on the page."
      - type: ordering
        id: klickweg
        text:
          de: Tom will von der Startseite zur Bücherei. Bringe die Seiten in die Reihenfolge, in der er sie öffnet.
          en: Tom wants to get from the home page to the library. Put the pages in the order he opens them.
        material:
          - type: figure
            image:
              de: images/stadtfuehrer-de.svg
              en: images/stadtfuehrer-en.svg
            alt:
              de: "Fünf Kästchen, in der Mitte die Startseite. Pfeile führen von der Startseite zu Schule und Bus, von Schule zu Bücherei, von Bus zu Schwimmbad, von Bücherei und Schwimmbad zur Startseite."
              en: "Five boxes, the home page in the middle. Arrows lead from the home page to School and Bus, from School to Library, from Bus to Pool, and from Library and Pool to the home page."
            caption:
              de: "Mias Plan des Stadtführers."
              en: "Mia's plan of the town guide."
            source:
              de: eigene Zeichnung, Oliver Jägle
              en: own drawing, Oliver Jägle
            licence: CC-BY-4.0
        items:
          - { de: Startseite, en: home page }
          - { de: Schule, en: School }
          - { de: Bücherei, en: Library }
        hint:
          de: Suche den Pfeil, der auf die Bücherei zeigt. Wo beginnt er?
          en: Find the arrow that points to the library. Where does it start?
        explanation:
          de: Zur Bücherei führt nur ein Pfeil, und zwar von der Schule. Zur Schule kommt Tom von der Startseite.
          en: Only one arrow leads to the library, from School. Tom gets to School from the home page.
      - type: true-false
        id: link-zurueck
        text:
          de: Die Seite Bus hat einen Link zum Schwimmbad. Darum kommt man vom Schwimmbad mit einem Klick zum Bus.
          en: The Bus page has a link to the pool. So you can get from the pool to the bus page in one click.
        material:
          - type: figure
            image:
              de: images/stadtfuehrer-de.svg
              en: images/stadtfuehrer-en.svg
            alt:
              de: "Fünf Kästchen, in der Mitte die Startseite. Pfeile führen von der Startseite zu Schule und Bus, von Schule zu Bücherei, von Bus zu Schwimmbad, von Bücherei und Schwimmbad zur Startseite."
              en: "Five boxes, the home page in the middle. Arrows lead from the home page to School and Bus, from School to Library, from Bus to Pool, and from Library and Pool to the home page."
            caption:
              de: "Mias Plan des Stadtführers."
              en: "Mia's plan of the town guide."
            source:
              de: eigene Zeichnung, Oliver Jägle
              en: own drawing, Oliver Jägle
            licence: CC-BY-4.0
        answer: false
        hint:
          de: Auf welcher Seite steht der Link? Ein Pfeil gilt nur in eine Richtung.
          en: Which page is the link on? An arrow only works in one direction.
        explanation:
          de: Der Link steht auf der Seite Bus. Vom Schwimmbad führt nur ein Link zur Startseite, von dort geht es zum Bus.
          en: The link is on the Bus page. From the pool, the only link leads to the home page, and from there to the bus.
      - type: single-choice
        id: buch-oder-hypertext
        text:
          de: Was kannst du im Stadtführer tun, aber nicht in einem gedruckten Buch?
          en: What can you do in the town guide but not in a printed book?
        options:
          - text: { de: Mit einem Klick zu einer anderen Seite springen., en: Jump to another page with one click. }
            correct: true
            info:
              de: Ein Link führt sofort zu seiner Zielseite. Im Buch musst du selbst blättern.
              en: A link takes you straight to its target page. In a book you have to turn the pages yourself.
          - text: { de: Seiten mit Text und Bildern lesen., en: Read pages with text and pictures. }
            correct: false
            info:
              de: Auch ein Buch hat Seiten mit Text und Bildern. Das ist kein Unterschied.
              en: A book also has pages with text and pictures. That is no difference.
          - text: { de: Bei der ersten Seite anfangen., en: Start at the first page. }
            correct: false
            info:
              de: Ein Buch beginnt auch vorn. Der Stadtführer hat dafür die Startseite.
              en: A book also starts at the front. The town guide has the home page for that.
        explanation:
          de: In einem Hypertext springst du über Links von Seite zu Seite und wählst selbst den Weg.
          en: In a hypertext you jump from page to page using links and choose the path yourself.
      - type: text
        text:
          de: "Jetzt seid ihr dran: Auf der nächsten Seite baut die 7b ihren eigenen Stadtführer."
          en: "Now it's your turn: on the next page, class 7b builds its own town guide."
