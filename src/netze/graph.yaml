# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Vom Baum zum Graphen
  en: From tree to graph
description:
  de: "Der Graph als Netz aus Knoten und Kanten: Busnetz, Freundesnetz aus Fäden, Weg, Länge eines Weges und Kreis."
  en: "The graph as a network of nodes and edges: a bus network, a friendship network made of string, path, length of a path and cycle."
competencies: [graph]
blocks:
  - type: section
    id: einstieg
    title:
      de: Ist das Busnetz ein Baum?
      en: Is the bus network a tree?
    blocks:
      - type: note
        title:
          de: Klassenchat 7b
          en: Class 7b chat
        blocks:
          - type: text
            text:
              de: |
                **Selin:** Samstag ins Schwimmbad? Wir treffen uns am Bahnhof.

                **Jona:** Hier ist der Busplan. Jede Linie ist eine direkte Fahrt ohne Halt dazwischen.

                **Mia:** Sieht aus wie unser Zimmerbaum vom Seeberg!
              en: |
                **Selin:** Swimming pool on Saturday? Let's meet at the station.

                **Jona:** Here is the bus map. Each line is a direct ride with no stop in between.

                **Mia:** Looks like our room tree from Seeberg!
      - type: figure
        image:
          de: images/busnetz-de.svg
          en: images/busnetz-en.svg
        alt:
          de: "Sechs Kästchen für Haltestellen: Markt oben, darunter Bahnhof, Schule und Schwimmbad, unten Park und Rathaus. Linien verbinden Markt mit Bahnhof, Schule und Schwimmbad, Bahnhof mit Park, Park mit Schule, Schule mit Rathaus und Rathaus mit Schwimmbad."
          en: "Six boxes for stops: Market at the top, below it Station, School and Pool, at the bottom Park and Town hall. Lines connect Market with Station, School and Pool, Station with Park, Park with School, School with Town hall and Town hall with Pool."
        caption:
          de: Jonas Busplan. Jedes Kästchen ist eine Haltestelle, jede Linie eine direkte Fahrt.
          en: Jona's bus map. Each box is a stop, each line is a direct ride.
        source:
          de: eigene Zeichnung, Oliver Jägle
          en: own drawing, Oliver Jägle
        licence: CC-BY-4.0
      - type: true-false
        id: busnetz-baum
        text:
          de: Mia hat recht. Das Busnetz ist ein Baum.
          en: Mia is right. The bus network is a tree.
        answer: false
        hint:
          de: Fahre vom Bahnhof zum Markt, dann weiter. Kommst du zum Bahnhof zurück, ohne eine Linie zweimal zu fahren?
          en: Ride from the station to the market, then on. Can you get back to the station without using a line twice?
        explanation:
          de: "Bahnhof, Markt, Schule, Park und wieder Bahnhof: Diese Fahrt führt im Kreis zurück. In einem Baum geht das nicht, denn dort hängt jeder Knoten an genau einem Knoten darüber."
          en: "Station, Market, School, Park and back to Station: this ride goes round in a loop. That is not possible in a tree, because there every node hangs from exactly one node above it."
  - type: section
    id: idee
    title:
      de: Knoten, Kanten, Wege
      en: Nodes, edges, paths
    blocks:
      - type: text
        text:
          de: |
            Auf dieser Seite lernst du, Netze wie das Busnetz als **Graph** darzustellen. Den Baum kennst du schon: Er
            hat Knoten und Kanten, und von der Wurzel führt genau ein Weg zu jedem Blatt. Im Busnetz gibt es keine
            Wurzel, und ein Weg darf zurückführen.
          en: |
            On this page you will learn to show networks like the bus network as a **graph**. You already know the
            tree: it has nodes and edges, and exactly one path leads from the root to each leaf. In the bus network
            there is no root, and a path may lead back.
      - type: definition
        term:
          de: Graph
          en: graph
        explanation:
          de: Ein Graph besteht aus Knoten und Kanten. Eine Kante verbindet zwei Knoten. Jeder Knoten darf mit jedem anderen verbunden sein.
          en: A graph is made of nodes and edges. An edge connects two nodes. Any node may be connected to any other node.
      - type: definition
        term:
          de: Weg
          en: path
        explanation:
          de: Ein Weg führt über Kanten von einem Knoten zu einem anderen. Die Länge eines Weges ist die Anzahl seiner Kanten.
          en: A path leads along edges from one node to another. The length of a path is the number of its edges.
      - type: number
        id: kuerzester-weg
        text:
          de: "Selin fährt vom Bahnhof zum Schwimmbad. Wie lang ist der kürzeste Weg? Gib die Anzahl der Kanten an."
          en: "Selin rides from the station to the pool. How long is the shortest path? Give the number of edges."
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 3
            message:
              de: Du hast die Haltestellen auf dem Weg gezählt. Die Länge eines Weges ist die Anzahl der Kanten.
              en: You counted the stops on the path. The length of a path is the number of edges.
          - answer: 4
            message:
              de: Das ist ein Umweg über Park oder Schule. Es gibt einen Weg mit weniger Kanten.
              en: That is a detour via the park or the school. There is a path with fewer edges.
        explanation:
          de: "Bahnhof – Markt – Schwimmbad sind 2 Kanten. Andere Wege, etwa über Park, Schule und Rathaus, sind 4 Kanten lang. Im Graphen gibt es oft mehrere Wege zum selben Knoten."
          en: "Station – Market – Pool is 2 edges. Other paths, for example via Park, School and Town hall, are 4 edges long. In a graph there are often several paths to the same node."
      - type: definition
        term:
          de: Kreis
          en: cycle
        explanation:
          de: Ein Kreis ist ein Weg, der zu seinem Startknoten zurückführt, ohne eine Kante zweimal zu nutzen.
          en: A cycle is a path that leads back to the node it started from without using any edge twice.
      - type: note
        title:
          de: Merke
          en: Remember
        blocks:
          - type: text
            text:
              de: |
                Ein Baum ist ein Graph **ohne Kreis**. Darum führt im Baum genau ein Weg zu jedem Knoten, im Graphen oft
                mehrere. Ein Graph in der Informatik ist kein Diagramm mit Achsen, sondern ein Netz.
              en: |
                A tree is a graph **with no cycle**. That is why in a tree exactly one path leads to each node, and in a
                graph there are often several. A graph in computer science is not a chart with axes, but a network.
  - type: section
    id: unplugged
    title:
      de: Ein Freundesnetz aus Fäden
      en: A friendship network made of string
    blocks:
      - type: text
        text:
          de: |
            Legt in der Klasse ein Netz, ohne Rechner. Ihr braucht Karten, einen Stift und ein Wollknäuel.

            1. Jede und jeder schreibt den eigenen Namen auf eine Karte und hält sie vor sich. Die Karte ist ein Knoten.
            2. Wer mit jemandem befreundet ist, spannt einen Faden zu dieser Person. Jeder Faden ist eine Kante.
            3. Sucht einen Kreis: Folgt den Fäden, bis ihr wieder bei der ersten Karte ankommt.
          en: |
            Lay out a network in class, without a computer. You need cards, a pen and a ball of wool.

            1. Everyone writes their own name on a card and holds it in front of them. The card is a node.
            2. If you are friends with someone, stretch a piece of string to that person. Each piece of string is an edge.
            3. Look for a cycle: follow the strings until you get back to the first card.
      - type: figure
        image: images/freunde.svg
        alt:
          de: "Sechs Namen: Jona, Selin, Mia, Tom, Lea und Ben. Linien verbinden Jona mit Selin, Mia und Tom, Selin mit Mia, Mia mit Lea und Tom mit Ben."
          en: "Six names: Jona, Selin, Mia, Tom, Lea and Ben. Lines connect Jona with Selin, Mia and Tom, Selin with Mia, Mia with Lea and Tom with Ben."
        caption:
          de: So kann ein Teil eures Netzes aussehen. Jona, Selin und Mia bilden einen Kreis.
          en: This is what part of your network might look like. Jona, Selin and Mia form a cycle.
        source:
          de: eigene Zeichnung, Oliver Jägle
          en: own drawing, Oliver Jägle
        licence: CC-BY-4.0
  - type: section
    id: bauen
    title:
      de: Das Freundesnetz am Rechner
      en: The friendship network on the computer
    blocks:
      - type: text
        text:
          de: |
            Jetzt baust du ein Freundesnetz am Rechner. Tippe einen Namen an und dann einen zweiten: Schon spannst du
            eine Kante zwischen den beiden. Tippst du dieselben zwei Namen noch einmal an, verschwindet die Kante. Unter
            dem Bild stehen alle deine Kanten, jede mit einem Knopf zum Entfernen.
          en: |
            Now you build a friendship network on the computer. Tap one name and then a second one: this puts an edge
            between the two. If you tap the same two names again, the edge disappears. Below the picture you can see all
            your edges, each with a button to remove it.
      - type: vue-component
        id: freundesnetz-bauen
        component: Netzbauer
        props:
          names: [Jona, Selin, Mia, Tom, Lea]
          directed: false
          task:
            de: "Lege für jede Freundschaft eine Kante an:"
            en: "Add an edge for each friendship:"
          line:
            de: "{a} ist mit {b} befreundet."
            en: "{a} and {b} are friends."
          chosen:
            de: "{a} ist ausgewählt. Tippe jetzt den zweiten Namen an."
            en: "{a} is selected. Now tap the second name."
          drawn:
            de: "Deine Kanten:"
            en: "Your edges:"
          empty:
            de: Noch keine Kanten.
            en: No edges yet.
          remove:
            de: "Kante {a} – {b} entfernen"
            en: "Remove edge {a} – {b}"
          mistakes:
            - de: "Bei {a} fehlt noch eine Kante. Lies alle Zeilen der Liste, in denen {a} vorkommt."
              en: "An edge at {a} is still missing. Read every line of the list that has {a} in it."
            - de: "Die Kante {a} – {b} steht nicht in der Liste. Entferne sie."
              en: "The edge {a} – {b} is not in the list. Remove it."
            - de: "Ein Pfeil zeigt falsch herum."
              en: "An arrow points the wrong way."
        examples:
          accepted:
            - { answer: [[0, 2], [0, 3], [0, 4], [1, 3], [2, 3], [2, 4]], seed: 1 }
            - { answer: [[4, 2], [3, 2], [3, 1], [4, 0], [3, 0], [2, 0]], seed: 1 }
          rejected:
            - { answer: [[0, 2], [0, 3], [0, 4], [1, 3], [2, 3]], seed: 1 }
            - { answer: [[0, 2], [0, 3], [0, 4], [1, 3], [2, 3], [2, 4], [0, 1]], seed: 1 }
            - { answer: [[0, 4]] }
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: number
        id: kanten-busnetz
        text:
          de: Wie viele Kanten hat das Busnetz?
          en: How many edges does the bus network have?
        answer: 7
        tolerance: 0
        mistakes:
          - answer: 6
            message:
              de: Du hast die Haltestellen gezählt, das sind die Knoten. Zähle die Linien.
              en: You counted the stops, which are the nodes. Count the lines.
          - answer: 8
            message:
              de: Du hast eine Linie doppelt gezählt. Hake jede Linie ab, wenn du sie gezählt hast.
              en: You counted one line twice. Tick off each line once you have counted it.
        hint:
          de: Zähle die Linien, die vom Markt ausgehen, dann die übrigen.
          en: Count the lines that start at the market, then the others.
        explanation:
          de: "Drei Kanten führen vom Markt weg, vier weitere verbinden Bahnhof, Park, Schule, Rathaus und Schwimmbad: zusammen 7. Ein Baum mit 6 Knoten hätte nur 5 Kanten."
          en: "Three edges lead away from the market, four more connect Station, Park, School, Town hall and Pool: 7 in total. A tree with 6 nodes would only have 5 edges."
      - type: true-false
        id: baum-ist-graph
        text:
          de: Jeder Baum ist auch ein Graph.
          en: Every tree is also a graph.
        answer: true
        explanation:
          de: Ein Baum besteht aus Knoten und Kanten, also ist er ein Graph. Er ist ein besonderer Graph, denn er hat keinen Kreis.
          en: A tree is made of nodes and edges, so it is a graph. It is a special graph, because it has no cycle.
      - type: single-choice
        id: kein-baum
        text:
          de: Welches Netz ist kein Baum?
          en: Which network is not a tree?
        material:
          - type: figure
            image: images/drei-netze.svg
            alt:
              de: "Drei Netze aus leeren Kästchen. A verzweigt sich von oben nach unten. B ist eine Zickzack-Kette. In C bilden vier Kästchen ein Viereck, an einem hängt ein fünftes."
              en: "Three networks of empty boxes. A branches out from top to bottom. B is a zigzag chain. In C, four boxes form a square, and a fifth hangs from one of them."
            caption:
              de: Drei Netze A, B und C. Suche nach einem Weg, der zurückführt.
              en: Three networks A, B and C. Look for a path that leads back.
            source:
              de: eigene Zeichnung, Oliver Jägle
              en: own drawing, Oliver Jägle
            licence: CC-BY-4.0
        options:
          - text: { de: C, en: C }
            correct: true
            info:
              de: In C führt ein Weg um das Viereck herum zum Start zurück. Das ist ein Kreis.
              en: In C, a path leads round the square back to the start. That is a cycle.
          - text: { de: B, en: B }
            correct: false
            info:
              de: B sieht anders aus als ein Baum im Bild, hat aber keinen Kreis. Eine Kette ist ein Baum ohne Verzweigung.
              en: B looks different from the usual tree picture, but it has no cycle. A chain is a tree without branches.
          - text: { de: A, en: A }
            correct: false
            info:
              de: A verzweigt sich wie der Zimmerbaum und hat keinen Kreis.
              en: A branches out like the room tree and has no cycle.
        explanation:
          de: Ein Baum ist ein Graph ohne Kreis. Wie das Netz gezeichnet ist, spielt keine Rolle. Nur C hat einen Kreis.
          en: A tree is a graph with no cycle. How the network is drawn does not matter. Only C has a cycle.
  - type: section
    id: galerie
    title:
      de: Die Galerie wächst
      en: The gallery grows
    blocks:
      - type: figure
        image: images/galerie-2.svg
        alt:
          de: Vier Bilderrahmen. Im ersten ein Baum, im zweiten ein Graph mit Kreisen. Der dritte und der vierte Rahmen sind leer, mit einem Fragezeichen.
          en: Four picture frames. The first holds a tree, the second a graph with cycles. The third and fourth frames are empty, with a question mark.
        caption:
          de: Die Galerie der Datenstrukturen. Neu ist der Graph im zweiten Rahmen.
          en: The gallery of data structures. The graph in the second frame is new.
        source:
          de: eigene Zeichnung, Oliver Jägle
          en: own drawing, Oliver Jägle
        licence: CC-BY-4.0
      - type: table
        caption:
          de: Wie finde ich ein Element?
          en: How do I find an element?
        header:
          - { de: Struktur, en: Structure }
          - { de: So findest du ein Element, en: How you find an element }
        rows:
          - - { de: Baum, en: tree }
            - {
                de: "Von der Wurzel aus nach unten: Es gibt genau einen Weg.",
                en: "From the root downwards: there is exactly one path.",
              }
          - - { de: Graph, en: graph }
            - {
                de: "Von einem Knoten aus den Kanten folgen: Oft gibt es mehrere Wege. Wähle einen kurzen.",
                en: "Follow the edges from a node: there are often several paths. Choose a short one.",
              }
      - type: text
        text:
          de: "Als Nächstes verlinken Jona, Selin und Mia ihre Seiten. Dabei zeigt jede Kante in eine Richtung."
          en: "Next, Jona, Selin and Mia link their pages. Here every edge points in one direction."
